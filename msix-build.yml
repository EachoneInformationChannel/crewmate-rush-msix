name: Generate Microsoft Store MSIX Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate Windows MSIX Package
      uses: pwabuilder/pwa-action@v1.0.8
      with:
        page-url: 'https://crewmate-rush-space-escape-runner.ai.studio'
        platform: 'windows'
        package-id: 'EachoneInformationChannel.CrewmateRushSpaceEscapeR'
        publisher-id: 'CN=CF437CC1-5A6E-4F84-B45D-A39F3D1BFEB6'
        publisher-display-name: 'Eachone Information Channel'
        app-name: 'Crewmate Rush Space Escape Runner'

    - name: Upload Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Store-Ready-MSIX
        path: './*.msix*'
