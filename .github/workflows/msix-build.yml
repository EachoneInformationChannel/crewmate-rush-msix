name: Generate Microsoft Store MSIX Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download & Build MSIX via PWABuilder API
      shell: powershell
      run: |
        $body = @{
            siteUrl = "https://crewmate-rush-space-escape-runner.ai.studio"
            packageId = "EachoneInformationChannel.CrewmateRushSpaceEscapeR"
            publisherId = "CN=CF437CC1-5A6E-4F84-B45D-A39F3D1BFEB6"
            publisherDisplayName = "Eachone Information Channel"
            appName = "Crewmate Rush Space Escape Runner"
            version = "1.0.0.0"
        } | ConvertTo-Json

        New-Item -ItemType Directory -Force -Path ./msix-output
        
        $response = Invoke-RestMethod -Uri "https://pwabuilder-win-chromium-build-api.azurewebsites.net/msix/generatezip" -Method Post -Body $body -ContentType "application/json" -OutFile "./msix-output/Store-Ready-MSIX.zip"

    - name: Upload Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Store-Ready-MSIX
        path: ./msix-output/Store-Ready-MSIX.zip
